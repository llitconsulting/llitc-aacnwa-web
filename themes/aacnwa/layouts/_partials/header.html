<!-- Top utility bar -->
<div class="bg-primary text-white text-sm">
  <div class="max-w-6xl mx-auto px-4 py-2 flex justify-between items-center">
    <span class="flex items-center gap-2">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.948V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
      </svg>
      <a href="tel:{{ site.Params.phone | replaceRE `[^0-9]` `` | printf "1%s" }}" class="hover:text-accent transition-colors">{{ site.Params.phone }}</a>
    </span>
    <div class="flex items-center gap-4">
      <a href="{{ site.Params.patientPortalURL }}" class="hover:text-accent transition-colors">Patient Portal</a>
      <a href="{{ site.Params.payBillURL }}" class="bg-accent text-primary-dark font-semibold px-3 py-1 rounded hover:bg-yellow-400 transition-colors">Pay Your Bill</a>
    </div>
  </div>
</div>

<!-- Main header -->
<div class="bg-white shadow-md">
  <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
    <!-- Logo / Site name -->
    <a href="/" class="flex items-center gap-3 no-underline">
      <div class="w-12 h-12 bg-primary rounded-full flex items-center justify-center shrink-0">
        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
        </svg>
      </div>
      <div>
        <div class="text-primary font-heading font-bold text-lg leading-tight">Allergy & Asthma Clinic</div>
        <div class="text-secondary text-sm font-semibold">of Northwest Arkansas</div>
      </div>
    </a>

    <!-- Navigation -->
    <nav>
      <ul class="flex flex-wrap gap-1 items-center list-none m-0 p-0">
        {{ range site.Menus.main }}
        <li>
          <a href="{{ .URL }}" class="text-text text-sm font-semibold px-3 py-2 rounded hover:text-primary hover:bg-bg-light transition-colors">
            {{ .Name }}
          </a>
        </li>
        {{ end }}
        <li>
          <a href="{{ site.Params.appointmentURL }}" class="ml-2 bg-secondary text-white text-sm font-semibold px-4 py-2 rounded-full hover:bg-secondary-dark transition-colors">
            Make Appointment
          </a>
        </li>
      </ul>
    </nav>
  </div>
</div>
